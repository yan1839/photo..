<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>인생네컷 📸</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --pink: #FF6B9D;
    --pink-light: #FFB3D0;
    --pink-pale: #FFF0F6;
    --yellow: #FFE14D;
    --dark: #1a0a0f;
    --white: #FFFFFF;
    --radius: 16px;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--pink-pale);
    font-family: 'Gowun Dodum', sans-serif;
    touch-action: manipulation;
  }

  #app {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    overflow: hidden;
    position: relative;
  }

  /* ── HEADER ── */
  .header {
    width: 100%;
    padding: 16px 20px 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    flex-shrink: 0;
  }

  .logo {
    font-family: 'Jua', sans-serif;
    font-size: 22px;
    color: var(--pink);
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .logo-dot {
    width: 8px; height: 8px;
    background: var(--yellow);
    border-radius: 50%;
    display: inline-block;
  }

  /* ── SCREENS ── */
  .screen {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
    flex: 1;
    overflow: hidden;
    padding: 0 20px 20px;
  }
  .screen.active { display: flex; }

  /* ── START SCREEN ── */
  #start-screen {
    justify-content: center;
    gap: 28px;
  }

  .start-illus {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  .film-strip {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .film-frame {
    width: 72px; height: 72px;
    border-radius: 10px;
    background: linear-gradient(135deg, #FFB3D0, #FF6B9D);
    border: 3px solid var(--dark);
    position: relative;
    overflow: hidden;
  }

  .film-frame::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.1);
    border-radius: 7px;
  }

  .film-frame:nth-child(1) { background: linear-gradient(135deg, #FFE14D, #FFB347); width: 64px; height: 64px; }
  .film-frame:nth-child(3) { background: linear-gradient(135deg, #B5EAD7, #6BC5A8); width: 64px; height: 64px; }
  .film-frame:nth-child(4) { background: linear-gradient(135deg, #C7B9FF, #9B7FE8); }

  .start-text {
    text-align: center;
  }

  .start-title {
    font-family: 'Jua', sans-serif;
    font-size: 28px;
    color: var(--dark);
    line-height: 1.3;
    margin-bottom: 8px;
  }

  .start-sub {
    font-size: 15px;
    color: #888;
    line-height: 1.6;
  }

  .btn-start {
    width: 100%;
    max-width: 280px;
    padding: 18px;
    background: var(--pink);
    color: white;
    border: none;
    border-radius: 50px;
    font-family: 'Jua', sans-serif;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 6px 0 #c94480;
    transition: transform 0.1s, box-shadow 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-start:active {
    transform: translateY(3px);
    box-shadow: 0 3px 0 #c94480;
  }

  /* ── CAMERA SCREEN ── */
  #camera-screen {
    gap: 0;
    padding: 0;
  }

  .camera-wrapper {
    width: 100%;
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #000;
  }

  #video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    display: block;
  }

  /* Thumbnail strip overlay */
  .thumb-strip {
    position: absolute;
    top: 12px;
    right: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 10;
  }

  .thumb-slot {
    width: 52px; height: 52px;
    border-radius: 8px;
    border: 2.5px solid rgba(255,255,255,0.5);
    overflow: hidden;
    background: rgba(0,0,0,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Jua', sans-serif;
    font-size: 16px;
    color: rgba(255,255,255,0.4);
    transition: border-color 0.3s;
    flex-shrink: 0;
  }

  .thumb-slot.filled {
    border-color: var(--yellow);
  }

  .thumb-slot img {
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
  }

  /* Counter badge */
  .shot-counter {
    position: absolute;
    top: 12px;
    left: 12px;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(4px);
    color: white;
    font-family: 'Jua', sans-serif;
    font-size: 14px;
    padding: 6px 12px;
    border-radius: 20px;
    z-index: 10;
  }

  /* Timer overlay */
  .timer-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    pointer-events: none;
  }

  .timer-num {
    font-family: 'Jua', sans-serif;
    font-size: 140px;
    color: white;
    text-shadow: 0 0 40px rgba(255,107,157,0.8);
    opacity: 0;
    transform: scale(1.5);
    transition: opacity 0.15s, transform 0.15s;
  }

  .timer-num.show {
    opacity: 1;
    transform: scale(1);
  }

  /* Flash overlay */
  .flash {
    position: absolute;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    z-index: 30;
    transition: opacity 0.05s;
  }

  .flash.on { opacity: 1; }

  /* Camera bottom bar */
  .cam-bar {
    width: 100%;
    padding: 16px 24px;
    background: var(--dark);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    flex-shrink: 0;
  }

  .btn-shutter {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: white;
    border: 4px solid var(--pink);
    cursor: pointer;
    position: relative;
    transition: transform 0.1s;
    flex-shrink: 0;
    outline: none;
  }

  .btn-shutter::after {
    content: '';
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    background: var(--pink);
  }

  .btn-shutter:active { transform: scale(0.92); }
  .btn-shutter:disabled { opacity: 0.4; }

  .cam-hint {
    color: rgba(255,255,255,0.5);
    font-size: 13px;
    text-align: center;
    flex: 1;
    line-height: 1.5;
  }

  /* ── RESULT SCREEN ── */
  #result-screen {
    justify-content: flex-start;
    gap: 16px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .result-label {
    font-family: 'Jua', sans-serif;
    font-size: 18px;
    color: var(--dark);
    text-align: center;
    margin-top: 4px;
  }

  /* Photo strip */
  .strip-wrapper {
    width: 100%;
    display: flex;
    justify-content: center;
  }

  #strip-canvas {
    max-width: 260px;
    width: 100%;
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(255,107,157,0.3);
    display: block;
  }

  .result-btns {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 320px;
  }

  .btn-dl {
    width: 100%;
    padding: 16px;
    background: var(--pink);
    color: white;
    border: none;
    border-radius: 50px;
    font-family: 'Jua', sans-serif;
    font-size: 17px;
    cursor: pointer;
    box-shadow: 0 5px 0 #c94480;
    transition: transform 0.1s, box-shadow 0.1s;
  }

  .btn-dl:active {
    transform: translateY(2px);
    box-shadow: 0 3px 0 #c94480;
  }

  .btn-retry {
    width: 100%;
    padding: 15px;
    background: transparent;
    color: var(--pink);
    border: 2px solid var(--pink);
    border-radius: 50px;
    font-family: 'Jua', sans-serif;
    font-size: 17px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .btn-retry:active { background: var(--pink-pale); }

  /* Error */
  .cam-error {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #111;
    color: white;
    font-size: 15px;
    text-align: center;
    padding: 24px;
    gap: 12px;
    z-index: 50;
  }

  .cam-error-icon { font-size: 48px; }
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <div class="header">
    <div class="logo">
      <span class="logo-dot"></span>
      인생네컷
      <span class="logo-dot"></span>
    </div>
  </div>

  <!-- START SCREEN -->
  <div class="screen active" id="start-screen">
    <div class="start-illus">
      <div class="film-strip">
        <div class="film-frame"></div>
        <div class="film-frame"></div>
      </div>
      <div class="film-strip">
        <div class="film-frame"></div>
        <div class="film-frame"></div>
      </div>
    </div>

    <div class="start-text">
      <div class="start-title">오늘의 네 컷을<br>남겨볼까요? 📸</div>
      <div class="start-sub">3초 카운트 후 자동 촬영<br>4장을 찍어 예쁜 필름으로 완성!</div>
    </div>

    <!-- 에러 메시지 (시작 화면에서 바로 표시) -->
    <div id="start-error" style="display:none; background:#fff0f6; border:2px solid #FF6B9D; border-radius:14px; padding:16px 18px; max-width:300px; width:100%; text-align:center; font-size:14px; color:#a0305a; line-height:1.7;"></div>

    <button class="btn-start" id="btn-go">
      📷 촬영 시작하기
    </button>
  </div>

  <!-- CAMERA SCREEN -->
  <div class="screen" id="camera-screen">
    <div class="camera-wrapper" id="cam-wrap">
      <video id="video" autoplay playsinline muted></video>

      <!-- Thumbnails -->
      <div class="thumb-strip" id="thumb-strip">
        <div class="thumb-slot" id="t0">1</div>
        <div class="thumb-slot" id="t1">2</div>
        <div class="thumb-slot" id="t2">3</div>
        <div class="thumb-slot" id="t3">4</div>
      </div>

      <!-- Shot counter -->
      <div class="shot-counter" id="shot-counter">0 / 4</div>

      <!-- Timer -->
      <div class="timer-overlay" id="timer-overlay">
        <div class="timer-num" id="timer-num"></div>
      </div>

      <!-- Flash -->
      <div class="flash" id="flash"></div>

      <!-- Error -->
      <div class="cam-error" id="cam-error" style="display:none;">
        <div class="cam-error-icon">📵</div>
        <div>카메라에 접근할 수 없어요<br>Safari 설정에서 카메라 권한을 허용해주세요</div>
      </div>
    </div>

    <div class="cam-bar">
      <div class="cam-hint" id="cam-hint">버튼을 눌러<br>촬영을 시작하세요</div>
      <button class="btn-shutter" id="btn-shutter" aria-label="촬영"></button>
      <div style="flex:1;"></div>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div class="screen" id="result-screen">
    <div class="result-label">✨ 나의 네 컷 완성!</div>
    <div class="strip-wrapper">
      <canvas id="strip-canvas"></canvas>
    </div>
    <div class="result-btns">
      <button class="btn-dl" id="btn-dl">💾 이미지 저장하기</button>
      <button class="btn-retry" id="btn-retry">🔄 다시 찍기</button>
    </div>
  </div>

</div>

<script>
const $ = id => document.getElementById(id);

// ── State
let photos = [];
let shooting = false;
let stream = null;

// ── Screen switcher
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}

// ── Start
$('btn-go').addEventListener('click', async () => {
  const errBox = $('start-error');
  errBox.style.display = 'none';

  // file:// 프로토콜 체크 (iPad Safari에서 카메라 불가)
  if (location.protocol === 'file:') {
    errBox.innerHTML = '⚠️ <strong>파일로 열면 카메라를 사용할 수 없어요</strong><br><br>아래 방법 중 하나를 사용해주세요:<br>① 이 파일을 <strong>AirDrop으로 Mac</strong>에 보낸 뒤<br>&nbsp;&nbsp;&nbsp;로컬 서버로 실행<br>② <strong>GitHub Pages</strong> 등에 올려서 링크로 열기<br>③ <strong>이메일/카카오톡</strong>으로 자신에게 보낸 뒤<br>&nbsp;&nbsp;&nbsp;Safari로 직접 열기';
    errBox.style.display = 'block';
    return;
  }

  // getUserMedia 지원 체크
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    errBox.innerHTML = '⚠️ 이 브라우저는 카메라를 지원하지 않아요.<br>Safari 최신 버전을 사용해주세요.';
    errBox.style.display = 'block';
    return;
  }

  showScreen('camera-screen');
  await startCamera();
});

// ── Camera
async function startCamera() {
  try {
    // 먼저 기본 제약으로 시도, 실패하면 최소 제약으로 재시도
    let constraints = { video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false };
    try {
      stream = await navigator.mediaDevices.getUserMedia(constraints);
    } catch {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
    }
    const video = $('video');
    video.srcObject = stream;
    // iOS Safari에서 autoplay 보장
    video.setAttribute('playsinline', '');
    video.setAttribute('muted', '');
    await video.play().catch(() => {});
    $('cam-error').style.display = 'none';
  } catch (e) {
    const msg = e.name === 'NotAllowedError'
      ? '카메라 권한이 거부됐어요.<br>Safari 설정 → 이 사이트 → 카메라 → 허용'
      : e.name === 'NotFoundError'
      ? '카메라를 찾을 수 없어요.'
      : `카메라 오류: ${e.name}`;
    $('cam-error').querySelector ? null : null;
    $('cam-error').innerHTML = `<div class="cam-error-icon">📵</div><div>${msg}</div><button onclick="history.back()" style="margin-top:12px;padding:10px 20px;background:#FF6B9D;color:white;border:none;border-radius:20px;font-size:15px;cursor:pointer;">← 돌아가기</button>`;
    $('cam-error').style.display = 'flex';
    console.error(e);
  }
}

// ── Shutter
$('btn-shutter').addEventListener('click', () => {
  if (shooting) return;
  startSequence();
});

async function startSequence() {
  if (shooting) return;
  shooting = true;
  $('btn-shutter').disabled = true;
  $('cam-hint').textContent = '';

  await countdown();
  await capturePhoto();

  if (photos.length < 4) {
    shooting = false;
    $('btn-shutter').disabled = false;
    $('cam-hint').textContent = photos.length === 0
      ? '버튼을 눌러\n촬영을 시작하세요'
      : `${photos.length}장 찍었어요!\n계속 찍어볼까요?`;
  } else {
    stopCamera();
    buildStrip();
    showScreen('result-screen');
  }
}

async function countdown() {
  const overlay = $('timer-overlay');
  const num = $('timer-num');
  for (let i = 3; i >= 1; i--) {
    num.textContent = i;
    num.classList.add('show');
    await sleep(800);
    num.classList.remove('show');
    await sleep(200);
  }
}

async function capturePhoto() {
  // Flash
  const flash = $('flash');
  flash.classList.add('on');
  await sleep(80);
  flash.classList.remove('on');

  // Draw to offscreen canvas
  const video = $('video');
  const w = video.videoWidth || 640;
  const h = video.videoHeight || 480;
  const oc = document.createElement('canvas');
  oc.width = w; oc.height = h;
  const ctx = oc.getContext('2d');
  ctx.save();
  ctx.scale(-1, 1);
  ctx.drawImage(video, -w, 0, w, h);
  ctx.restore();

  const dataUrl = oc.toDataURL('image/jpeg', 0.92);
  photos.push(dataUrl);

  // Update thumbnail
  const idx = photos.length - 1;
  const slot = $('t' + idx);
  slot.innerHTML = '';
  const img = document.createElement('img');
  img.src = dataUrl;
  slot.appendChild(img);
  slot.classList.add('filled');

  // Counter
  $('shot-counter').textContent = `${photos.length} / 4`;

  await sleep(300);
}

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
}

// ── Build film strip canvas
function buildStrip() {
  const canvas = $('strip-canvas');
  const FRAME_W = 520;
  const FRAME_H = 390;
  const PAD = 28;
  const GAP = 16;
  const STRIP_W = FRAME_W + PAD * 2;
  const HEADER_H = 80;
  const FOOTER_H = 90;
  const STRIP_H = HEADER_H + (FRAME_H + GAP) * 4 - GAP + FOOTER_H + PAD;

  canvas.width = STRIP_W;
  canvas.height = STRIP_H;
  const ctx = canvas.getContext('2d');

  // Background — warm cream
  ctx.fillStyle = '#FFF8F3';
  ctx.fillRect(0, 0, STRIP_W, STRIP_H);

  // Outer border accent
  ctx.strokeStyle = '#FF6B9D';
  ctx.lineWidth = 6;
  ctx.strokeRect(3, 3, STRIP_W - 6, STRIP_H - 6);

  // Header text
  ctx.font = 'bold 32px serif';
  ctx.fillStyle = '#FF6B9D';
  ctx.textAlign = 'center';
  ctx.fillText('✿ 인생네컷 ✿', STRIP_W / 2, HEADER_H - 24);

  // Sprocket holes
  function drawHoles(x) {
    for (let i = 0; i < 10; i++) {
      const y = HEADER_H + i * ((STRIP_H - HEADER_H - FOOTER_H) / 10);
      ctx.fillStyle = '#FFE14D';
      roundRect(ctx, x - 6, y + 4, 12, 18, 3, true, false);
    }
  }
  drawHoles(PAD / 2);
  drawHoles(STRIP_W - PAD / 2);

  // Draw 4 photos
  const loadPromises = photos.map((src, i) => {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const y = HEADER_H + i * (FRAME_H + GAP);
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.12)';
        ctx.fillRect(PAD + 3, y + 3, FRAME_W, FRAME_H);
        // Photo
        ctx.save();
        roundRectClip(ctx, PAD, y, FRAME_W, FRAME_H, 8);
        const scale = Math.max(FRAME_W / img.width, FRAME_H / img.height);
        const sw = img.width * scale, sh = img.height * scale;
        ctx.drawImage(img, PAD + (FRAME_W - sw) / 2, y + (FRAME_H - sh) / 2, sw, sh);
        ctx.restore();
        resolve();
      };
      img.src = src;
    });
  });

  Promise.all(loadPromises).then(() => {
    // Footer
    const now = new Date();
    const date = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;
    ctx.font = '22px serif';
    ctx.fillStyle = '#c94480';
    ctx.textAlign = 'center';
    ctx.fillText(date, STRIP_W / 2, STRIP_H - FOOTER_H + 36);
    ctx.font = '18px serif';
    ctx.fillStyle = '#FFAECE';
    ctx.fillText('♡ 오늘도 빛나는 하루 ♡', STRIP_W / 2, STRIP_H - FOOTER_H + 66);
  });
}

function roundRect(ctx, x, y, w, h, r, fill, stroke) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
  if (fill) ctx.fill();
  if (stroke) ctx.stroke();
}

function roundRectClip(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
  ctx.clip();
}

// ── Download
$('btn-dl').addEventListener('click', () => {
  const canvas = $('strip-canvas');
  const a = document.createElement('a');
  a.download = `인생네컷_${Date.now()}.jpg`;
  a.href = canvas.toDataURL('image/jpeg', 0.95);
  a.click();
});

// ── Retry
$('btn-retry').addEventListener('click', () => {
  photos = [];
  shooting = false;
  for (let i = 0; i < 4; i++) {
    const slot = $('t' + i);
    slot.innerHTML = (i + 1).toString();
    slot.classList.remove('filled');
  }
  $('shot-counter').textContent = '0 / 4';
  $('btn-shutter').disabled = false;
  $('cam-hint').textContent = '버튼을 눌러\n촬영을 시작하세요';
  showScreen('camera-screen');
  startCamera();
});

// ── Utility
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
</script>
